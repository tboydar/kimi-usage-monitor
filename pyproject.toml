[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kimi-monitor"
version = "1.0.0"
description = "A beautiful real-time terminal monitoring tool for Kimi AI usage with advanced analytics"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    {name = "Kimi User", email = "user@example.com"}
]
keywords = ["kimi", "moonshot", "ai", "usage", "monitor", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "tzlocal>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
kimi-monitor = "kimi_monitor.cli:main"
kimi-usage = "kimi_monitor.cli:main"
km = "kimi_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/eugene/kimi-usage-monitor"
Repository = "https://github.com/eugene/kimi-usage-monitor"
Issues = "https://github.com/eugene/kimi-usage-monitor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kimi_monitor"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
